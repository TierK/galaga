<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#05050d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>GALAGA - Authentic Arcade 1981</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    :root {
      --arcade-bg: #070712;
      --cabinet-dark: #101026;
      --arcade-red: #ff2a2a;
      --arcade-yellow: #ffff00;
      --arcade-cyan: #00e5ff;
      --arcade-white: #ffffff;
      --arcade-blue: #2a52be;
      --glow-blue: rgba(0, 229, 255, 0.4);
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: var(--arcade-bg);
      color: var(--arcade-white);
      font-family: 'Press Start 2P', monospace, monospace;
      overflow: hidden;
      touch-action: none;
    }

    #app {
      display: flex;
      flex-direction: row;
      justify-content: center;
      align-items: center;
      width: 100vw;
      height: 100vh;
      position: relative;
    }

    /* ARCADE CABINET WRAPPER */
    .cabinet-container {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #111129 0%, #05050f 100%);
      box-shadow: 0 0 50px rgba(0, 0, 0, 0.9);
      border-radius: 8px;
      padding: 12px;
      position: relative;
      max-width: 100vw;
      max-height: 100vh;
    }

    /* SCREEN FRAME */
    .screen-wrapper {
      position: relative;
      background: #000;
      border: 4px solid #222238;
      box-shadow: inset 0 0 25px rgba(0,0,0,0.8), 0 0 15px rgba(42, 82, 190, 0.3);
      border-radius: 6px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* THE MAIN RETRO CANVAS */
    #game-canvas {
      image-rendering: -moz-crisp-edges;
      image-rendering: -webkit-crisp-edges;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      display: block;
      background-color: #000000;
    }

    /* CRT SCANLINE OVERLAY */
    .crt-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.45) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
      background-size: 100% 3px, 6px 100%;
      opacity: 0.85;
      display: block;
      transition: opacity 0.2s ease;
    }

    .crt-overlay.disabled {
      display: none;
    }

    /* SIDE CABINET PANEL (Desktop) */
    .side-panel {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      width: 240px;
      height: 100%;
      margin-left: 20px;
      padding: 16px;
      background: #0c0c1e;
      border: 2px solid #24244d;
      border-radius: 6px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.6);
    }

    .marquee-title {
      color: var(--arcade-red);
      text-shadow: 2px 2px #ffff00, -2px -2px #00e5ff;
      font-size: 20px;
      text-align: center;
      letter-spacing: 2px;
      margin-bottom: 12px;
    }

    .cabinet-meta {
      font-size: 9px;
      line-height: 1.7;
      color: #9aa;
    }

    .meta-highlight {
      color: var(--arcade-yellow);
    }

    .button-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 15px;
    }

    .arcade-btn {
      font-family: inherit;
      font-size: 10px;
      background: #1c1c38;
      color: #00e5ff;
      border: 2px solid #00e5ff;
      padding: 10px;
      border-radius: 4px;
      cursor: pointer;
      text-transform: uppercase;
      transition: all 0.15s ease;
      text-align: center;
    }

    .arcade-btn:hover, .arcade-btn:active {
      background: #00e5ff;
      color: #000;
      box-shadow: 0 0 10px var(--glow-blue);
    }

    /* MOBILE TOUCH CONTROLS DECK */
    #mobile-controls {
      display: none;
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 160px;
      background: linear-gradient(180deg, rgba(8, 8, 20, 0.95) 0%, #030308 100%);
      border-top: 2px solid #25254a;
      touch-action: none;
      z-index: 50;
      padding: 10px 20px;
      box-sizing: border-box;
    }

    .touch-deck-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      height: 100%;
    }

    /* VIRTUAL JOYSTICK */
    .joystick-zone {
      position: relative;
      width: 120px;
      height: 120px;
      background: rgba(255, 255, 255, 0.05);
      border: 3px solid rgba(0, 229, 255, 0.4);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: none;
    }

    .joystick-thumb {
      position: absolute;
      width: 50px;
      height: 50px;
      background: radial-gradient(circle, #00e5ff 0%, #154c79 100%);
      border: 2px solid #fff;
      border-radius: 50%;
      box-shadow: 0 0 12px var(--glow-blue);
      transform: translate(0px, 0px);
      pointer-events: none;
    }

    /* MOBILE QUICK ACTION BUTTONS */
    .mobile-center-actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center;
    }

    .mobile-small-btn {
      font-family: inherit;
      font-size: 8px;
      padding: 6px 12px;
      background: #1c1c38;
      border: 1px solid #ffcc00;
      color: #ffcc00;
      border-radius: 4px;
      cursor: pointer;
    }

    /* BIG ARCADE FIRE BUTTON */
    .fire-button {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: radial-gradient(circle, #ff2a2a 0%, #880000 100%);
      border: 4px solid #ffaaaa;
      color: #fff;
      font-family: inherit;
      font-size: 14px;
      font-weight: bold;
      text-shadow: 1px 1px 2px #000;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 0 #550000, 0 10px 15px rgba(255, 0, 0, 0.4);
      cursor: pointer;
      user-select: none;
      touch-action: none;
      transition: transform 0.05s ease, box-shadow 0.05s ease;
    }

    .fire-button:active, .fire-button.pressed {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #550000, 0 4px 8px rgba(255, 0, 0, 0.6);
      background: radial-gradient(circle, #ff5555 0%, #aa0000 100%);
    }

    .fire-button.locked {
      background: radial-gradient(circle, #ffaa00 0%, #bb5500 100%);
      border-color: #ffff00;
      box-shadow: 0 0 20px rgba(255, 200, 0, 0.8), 0 3px 0 #663300;
      color: #000;
      text-shadow: none;
      animation: pulse-fire 0.8s infinite alternate;
    }

    @keyframes pulse-fire {
      from { box-shadow: 0 0 10px rgba(255, 200, 0, 0.5); }
      to { box-shadow: 0 0 25px rgba(255, 255, 0, 0.95); }
    }

    /* DEV DEBUG DRAWER */
    #debug-drawer {
      position: fixed;
      top: 0;
      right: -320px;
      width: 320px;
      height: 100%;
      background: rgba(12, 12, 26, 0.96);
      border-left: 2px solid #00e5ff;
      box-shadow: -5px 0 20px rgba(0,0,0,0.8);
      padding: 20px 15px;
      transition: right 0.25s ease-in-out;
      z-index: 100;
      overflow-y: auto;
      font-size: 9px;
    }

    #debug-drawer.open {
      right: 0;
    }

    .debug-title {
      color: #00e5ff;
      font-size: 11px;
      margin-bottom: 15px;
      border-bottom: 1px solid #24244d;
      padding-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .debug-close {
      cursor: pointer;
      color: #ff2a2a;
    }

    .debug-btn {
      width: 100%;
      background: #1b1b36;
      color: #ffff00;
      border: 1px solid #ffff00;
      font-family: inherit;
      font-size: 8px;
      padding: 8px;
      margin-bottom: 8px;
      cursor: pointer;
      text-align: left;
    }

    .debug-btn:hover {
      background: #ffff00;
      color: #000;
    }

    .debug-toggle-btn {
      position: fixed;
      top: 10px;
      right: 10px;
      background: rgba(28, 28, 56, 0.8);
      border: 1px solid #00e5ff;
      color: #00e5ff;
      font-family: inherit;
      font-size: 8px;
      padding: 6px 10px;
      border-radius: 4px;
      cursor: pointer;
      z-index: 90;
    }

    /* RESPONSIVE LAYOUT FOR MOBILE / PHONES / TABLETS (10" and smaller) */
    @media (pointer: coarse) and (max-width: 900px), (max-width: 600px) {
      .side-panel {
        display: none;
      }
      .cabinet-container {
        padding: 0;
        border-radius: 0;
        background: #000;
        box-shadow: none;
        width: 100%;
        height: 100%;
      }
      .screen-wrapper {
        border: none;
        box-shadow: none;
        border-radius: 0;
      }
      #mobile-controls {
        display: flex;
      }
    }

    /* LANDSCAPE MOBILE */
    @media (max-height: 500px) and (orientation: landscape) {
      #mobile-controls {
        background: transparent;
        border-top: none;
        pointer-events: none;
        height: 100%;
        padding: 0 20px;
      }
      .joystick-zone {
        pointer-events: auto;
      }
      .fire-button {
        pointer-events: auto;
      }
      .mobile-center-actions {
        pointer-events: auto;
      }
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="cabinet-container">
      <div class="screen-wrapper" id="screen-wrapper">
        <canvas id="game-canvas" width="224" height="288"></canvas>
        <div class="crt-overlay" id="crt-overlay"></div>
      </div>

      <!-- DESKTOP CABINET BEZEL -->
      <aside class="side-panel">
        <div>
          <h1 class="marquee-title">GALAGA</h1>
          <div class="cabinet-meta">
            <p>1981 NAMCO LTD.</p>
            <p style="margin-top: 8px;">CONTROL SCHEME:</p>
            <p><span class="meta-highlight">WASD / ARROWS</span> : 4-WAY MOVE</p>
            <p><span class="meta-highlight">SPACE / J</span> : FIRE (HOLD AUTO)</p>
            <p><span class="meta-highlight">F</span> : LOCK AUTO-FIRE (2x TAP)</p>
            <p><span class="meta-highlight">P</span> : PAUSE</p>
            <p><span class="meta-highlight">~</span> : DEV CHEATS</p>
            <p style="margin-top: 8px;"><span class="meta-highlight">MOBILE</span>: JOYSTICK + 2x TAP LOCK</p>
          </div>
        </div>

        <div class="button-group">
          <button id="btn-sound-toggle" class="arcade-btn">SOUND: ON</button>
          <button id="btn-crt-toggle" class="arcade-btn">CRT SCANLINES: ON</button>
          <button id="btn-pause-toggle" class="arcade-btn">PAUSE GAME</button>
          <button id="btn-restart" class="arcade-btn" style="border-color: #ff2a2a; color: #ff2a2a;">RESTART</button>
        </div>
      </aside>
    </div>

    <!-- MOBILE CONTROL DECK -->
    <div id="mobile-controls">
      <div class="touch-deck-row">
        <div class="joystick-zone" id="joystick-zone">
          <div class="joystick-thumb" id="joystick-thumb"></div>
        </div>

        <div class="mobile-center-actions">
          <button id="mobile-pause-btn" class="mobile-small-btn">PAUSE</button>
          <button id="mobile-sound-btn" class="mobile-small-btn">AUDIO</button>
        </div>

        <div class="fire-button" id="mobile-fire-btn">FIRE</div>
      </div>
    </div>

    <!-- DEV DEBUG OVERLAY BUTTON & DRAWER -->
    <button id="btn-debug-open" class="debug-toggle-btn">[DEV CHEATS]</button>
    <div id="debug-drawer">
      <div class="debug-title">
        <span>DEVELOPER CHEATS</span>
        <span class="debug-close" id="btn-debug-close">[X]</span>
      </div>
      <button id="dbg-tractor" class="debug-btn" title="Triggers the boss to fire the gravitational tractor beam">TRIGGER TRACTOR BEAM</button>
      <button id="dbg-dual" class="debug-btn" title="Instantly equips a dual fighter with 2x firepower">ACTIVATE DUAL FIGHTER</button>
      <button id="dbg-challenging" class="debug-btn" title="Jump directly to the bonus target practice stage">JUMP CHALLENGING STAGE</button>
      <button id="dbg-godmode" class="debug-btn" title="Toggle invincibility against all bullets and collisions">TOGGLE GOD MODE (OFF)</button>
      <button id="dbg-nextstage" class="debug-btn" title="Skip current wave and advance to the next stage">ADVANCE NEXT STAGE</button>
      <button id="dbg-addlife" class="debug-btn" title="Add 1 extra ship life">+1 EXTRA SHIP LIFE</button>
      <button id="dbg-addscore" class="debug-btn" title="Add 10,000 bonus score points">+10,000 BONUS POINTS</button>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
